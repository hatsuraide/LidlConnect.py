[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LidlConnect.py"
version = "0.1.1"
description = "Python API client for Lidl Connect"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Hatsura", email = "info@hatsura.dev" }
]
dependencies = [
  "bs4",
  "requests"
]

[project.urls]
Homepage = "https://github.com/hatsuraide/LidlConnect.py"
