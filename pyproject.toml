[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LidlConnect.py"
version = "0.2.0"
description = "Python API client for Lidl Connect"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Hatsura", email = "info@hatsura.dev" }
]
requires-python = ">=3.10"
dependencies = [
  "requests",
  "beautifulsoup4",
]

[project.urls]
Homepage = "https://github.com/hatsuraide/LidlConnect.py"

[tool.setuptools.packages.find]
where = ["src"]
